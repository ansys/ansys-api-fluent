name: GitHub CI

# run only on main branch. This avoids duplicated actions on PRs
on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
      
env:
  MAIN_PYTHON_VERSION: '3.12'
  FLUENT_IMAGE_TAG: 'v27.1.latest'
  PYFLUENT_LAUNCH_CONTAINER: '1'
  PYFLUENT_LAUNCH_FLUENT_TIMEOUT: '180'
  ANSYSLMD_LICENSE_FILE: ${{ format('1055@{0}', secrets.LICENSE_SERVER) }}
  DOCUMENTATION_CNAME: 'https://ansys-internal.github.io/ansys-api-fluent/'

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Install build requirements
        run: |
          python -m pip install -U pip
          python -m pip install build

      - name: Build
        run: python -m build

      - name: Install
        run: python -m pip install dist/*.whl

      - name: Test import
        run: |
          mkdir tmp
          cd tmp
          python -c "from ansys.api.fluent.v0 import app_utilities_pb2; print('app_utilities_pb2 OK')"
          python -c "from ansys.api.fluent import __version__; print(__version__)"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ansys-api-fluent-artifacts
          path: dist/
          retention-days: 7

  test:
    name: Unit tests
    needs: [build]
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-fluent-artifacts
          path: dist

      - name: Install package and test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/requirements_tests.txt
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Generate gRPC certificates
        run: bash .ci/generate_certs.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ansys-bot
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Fluent Docker image
        run: docker pull ghcr.io/ansys/fluent:${{ env.FLUENT_IMAGE_TAG }}

      - name: Remove source tree to prevent import shadowing
        run: rm -rf ansys/ ansys_api_fluent.egg-info/

      - name: Run unit tests
        run: python -m pytest tests/ -v
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Install documentation dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/requirements_docs.txt

      - name: Regenerate proto reference fragments
        # Mirrors what the Sphinx ``proto_docgen`` extension does on
        # ``builder-inited`` so failures surface as their own CI step.
        run: python docs/_ext/proto_docgen.py

      - name: Build documentation
        run: |
          cd docs
          make clean
          make html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ansys-api-fluent-docs
          path: docs/_build/html/
          retention-days: 7
  
  deploy-docs-release:
    name: "Upload developer documentation to GitHub Pages"
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [ docs ]
    steps:
      - name: "Deploy the stable documentation"
        uses: ansys/actions/doc-deploy-dev@0b23d99e6800f16337ff173fcfbfcc1251130e99 # v11.0.2
        with:
          doc-artifact-name: "ansys-api-fluent-docs"
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: Release package to GitHub
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build, pre-commit, docs]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-fluent-artifacts
          path: ansys-api-fluent-artifacts

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
            ./**/*.tar.gz

  release-pypi:
    name: Release project to PyPI
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build, pre-commit]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-fluent-artifacts
          path: ansys-api-fluent-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ansys-api-fluent-artifacts
          skip-existing: false

  release-private-pypi:
    name: Release project to private PyPI
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build, pre-commit]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-fluent-artifacts
          path: ansys-api-fluent-artifacts

      - name: Display structure of downloaded files
        run: ls -R

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Upload to Private PyPi
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine setuptools wheel
          python -m twine check ./**/*.whl
          python -m twine upload ./**/*.whl
        env:
          TWINE_USERNAME: PAT
          TWINE_PASSWORD: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
          TWINE_REPOSITORY_URL: https://pkgs.dev.azure.com/pyansys/_packaging/pyansys/pypi/upload
