syntax = "proto3";

package grpcRemoting;

service OTelExporter {
  rpc BeginStreaming(OTelExporterRequest) returns (stream OTelExporterResponse) {}
}

message OTelExporterRequest {
}

enum ExporterType {
  OTEL_TRACE = 0;
  OTEL_METRICS = 1;
  OTEL_LOGS = 2;
}

message OTelExporterResponse {
  ExporterType type = 1;
  string output = 2;
}
