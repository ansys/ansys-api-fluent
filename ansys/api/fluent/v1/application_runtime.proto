syntax = "proto3";

package ansys.api.fluent.v1.application_runtime;

import "google/protobuf/duration.proto";

// ApplicationRuntime service provides methods that span the Fluent application lifecycle but do not belong
// to a domain-specific service. Typical uses include retrieving version and build metadata, managing
// feature flags, and controlling application startup and shutdown.
service ApplicationRuntime {
  // Returns the product version of the running application.
  rpc GetProductVersion(GetProductVersionRequest) returns (GetProductVersionResponse);

  // Returns build metadata for the running application (build time, build id, and other related information).
  rpc GetBuildInfo(GetBuildInfoRequest) returns (GetBuildInfoResponse);

  // Retrieves Controller process information when running in client-server mode (Controller -> Solver)
  // i.e., the Controller process commanding the Solver process.
  rpc GetControllerProcessInfo(GetControllerProcessInfoRequest) returns (GetControllerProcessInfoResponse);

  // Returns solver-process information for the running application.
  rpc GetSolverProcessInfo(GetSolverProcessInfoRequest) returns (GetSolverProcessInfoResponse);

  // Returns the current application mode (for example, meshing or solver).
  rpc GetAppMode(GetAppModeRequest) returns (GetAppModeResponse);

  // Returns the current application dimension (for example, 2d or 3d).
  rpc GetAppDimension(GetAppDimensionRequest) returns (GetAppDimensionResponse);

  // Returns the current application precision (for example, single or double).
  rpc GetAppPrecision(GetAppPrecisionRequest) returns (GetAppPrecisionResponse);

  // Returns the current application processor count.
  rpc GetAppProcessorCount(GetAppProcessorCountRequest) returns (GetAppProcessorCountResponse);

  // Returns the current application UI mode.
  rpc GetAppUIMode(GetAppUIModeRequest) returns (GetAppUIModeResponse);

  // Returns the current application graphics driver.
  rpc GetAppGraphicsDriver(GetAppGraphicsDriverRequest) returns (GetAppGraphicsDriverResponse);

  // Returns the current application GPU configuration.
  rpc GetAppGPUConfig(GetAppGPUConfigRequest) returns (GetAppGPUConfigResponse);

  // Starts a Python journal recording session.
  // If a journal file name is provided, the journal is written to that file.
  rpc StartPythonJournal(StartPythonJournalRequest) returns (StartPythonJournalResponse);

  // Stops a Python journal recording session.
  rpc StopPythonJournal(StopPythonJournalRequest) returns (StopPythonJournalResponse);

  // Checks whether beta/experimental features are enabled for this session.
  rpc IsBetaEnabled(IsBetaEnabledRequest) returns (IsBetaEnabledResponse);

  // Enables beta/experimental features for this session.
  rpc EnableBeta(EnableBetaRequest) returns (EnableBetaResponse);

  // Terminates the application.
  rpc Exit(ExitRequest) returns (ExitResponse);

  // Changes the application's current working directory.
  rpc SetWorkingDirectory(SetWorkingDirectoryRequest) returns (SetWorkingDirectoryResponse);

  // Sets the session idle timeout.
  // When the session has been idle for the specified duration, Fluent will exit.
  // Pass a zero duration to disable the idle timeout.
  rpc SetIdleTimeout(SetIdleTimeoutRequest) returns (SetIdleTimeoutResponse);
}

// Request to retrieve product version information.
message GetProductVersionRequest {
}

// Contains the product version information.
message GetProductVersionResponse {
  // Major version number.
  int64 major = 1;
  // Minor version number.
  int64 minor = 2;
  // Patch version number.
  int64 patch = 3;
}

// Request to retrieve build information.
message GetBuildInfoRequest {
}

// Contains the build information.
message GetBuildInfoResponse {
  // Build timestamp (format is server-defined).
  string build_time = 1;
  // Build identifier (server-defined).
  int64 build_id = 2;
  // Version-control revision identifier (for example, a commit hash).
  string vcs_revision = 3;
  // Version-control branch name.
  string vcs_branch = 4;
}

// Request to retrieve Controller process information.
message GetControllerProcessInfoRequest {
}

// Contains the Controller process information.
message GetControllerProcessInfoResponse {
  // Hostname where the Controller process is running.
  string hostname = 1;
  // Operating-system process id of the Controller process.
  int64 process_id = 2;
  // Controller process working directory.
  string working_directory = 3;
}

// Request to retrieve Solver process information.
message GetSolverProcessInfoRequest {
}

// Contains the Solver process information.
message GetSolverProcessInfoResponse {
  // Hostname where the Solver process is running.
  string hostname = 1;
  // Operating-system process id of the Solver process.
  int64 process_id = 2;
  // Solver process working directory.
  string working_directory = 3;
}

// Request to retrieve the application mode.
message GetAppModeRequest {
}

// Contains the application mode.
message GetAppModeResponse {
  // Current application mode.
  AppMode app_mode = 1;
}

// Request to retrieve the application dimension.
message GetAppDimensionRequest {
}

// Contains the application dimension.
message GetAppDimensionResponse {
  // Current application dimension.
  AppDimension app_dimension = 1;
}

// Request to retrieve the application precision.
message GetAppPrecisionRequest {
}

// Contains the application precision.
message GetAppPrecisionResponse {
  // Current application precision.
  AppPrecision app_precision = 1;
}

// Request to retrieve the application processor count.
message GetAppProcessorCountRequest {
}

// Contains the application processor count.
message GetAppProcessorCountResponse {
  // Current application processor count.
  int64 app_processor_count = 1;
}

// Request to retrieve the application UI mode.
message GetAppUIModeRequest {
}

// Contains the application UI mode.
message GetAppUIModeResponse {
  // Current application UI mode.
  AppUIMode app_ui_mode = 1;
}

// Request to retrieve the application graphics driver.
message GetAppGraphicsDriverRequest {
}

// Contains the application graphics driver details.
message GetAppGraphicsDriverResponse {
  oneof driver {
    // Current Windows application graphics driver.
    AppWindowsGraphicsDriver app_windows_graphics_driver = 1;

    // Current Linux application graphics driver.
    AppLinuxGraphicsDriver app_linux_graphics_driver = 2;
  }
}

// Request to retrieve the application GPU configuration.
message GetAppGPUConfigRequest {
}

// Contains the application GPU configuration details.
message GetAppGPUConfigResponse {
  oneof config {
    // True when the GPUs are allocated automatically based on availability.
    bool auto_allocate = 1;

    // A list of specific GPU device IDs explicitly allocated to the application.
    GpuIdList specific_gpu_ids = 2;
  }
}

// Wrapper message to hold a collection of GPU device IDs.
message GpuIdList {
  // List of integer IDs corresponding to the allocated GPUs.
  repeated int32 gpu_ids = 1;
}

// Initiates a Python journal recording session.
message StartPythonJournalRequest {
  // Optional journal output file name.
  //
  // If set, the journal is written to this file on the server side.
  // If not set, the journal text can be retrieved from StopPythonJournal.
  optional string journal_name = 1;
}

// Contains the result of starting a Python journal.
message StartPythonJournalResponse {
  // Optional journal identifier.
  //
  // Returned when no journal file name was provided and the journal is tracked in-memory/session state.
  // Provide this id to StopPythonJournal to stop the correct recording session.
  optional string journal_id = 1;
}

// Terminates a Python journal recording session.
message StopPythonJournalRequest {
  // Optional journal identifier to stop.
  //
  // Required when StartPythonJournal did not provide a file name and returned a journal_id.
  optional string journal_id = 1;
}

// Contains the result of stopping a Python journal.
message StopPythonJournalResponse {
  // Journal content.
  //
  // Typically populated when StartPythonJournal did not specify a file name. If the journal was written
  // to a file, this string may be empty (server-defined behavior).
  string journal_str = 1;
}

// Request to check if beta features are enabled.
message IsBetaEnabledRequest {
}

// Indicates whether beta features are enabled.
message IsBetaEnabledResponse {
  // True if beta/experimental features are enabled for this session.
  bool is_beta_enabled = 1;
}

// Requests to enable beta features.
message EnableBetaRequest {
}

// Result of enabling beta features.
message EnableBetaResponse {
}

// Requests to exit the application.
message ExitRequest {
}

// Result of an exit request.
message ExitResponse {
}

// Changes the application's working directory.
message SetWorkingDirectoryRequest {
  // New working directory path.
  string path = 1;
}

// Result of setting the working directory.
message SetWorkingDirectoryResponse {
}

// Requests to set the session idle timeout.
message SetIdleTimeoutRequest {
  // Idle timeout duration.
  // When the session has been idle for this duration, Fluent will exit.
  // Pass a zero duration to disable the idle timeout.
  google.protobuf.Duration timeout = 1;
}

// Result of setting the idle timeout.
message SetIdleTimeoutResponse {
}

// Application operating mode.
enum AppMode {
  // Unspecified application mode.
  APP_MODE_UNSPECIFIED = 0;
  // Meshing mode.
  APP_MODE_MESHING = 1;
  // Solver mode.
  APP_MODE_SOLVER = 2;
  // Solver icing mode.
  APP_MODE_SOLVER_ICING = 3;
  // Solver aero mode.
  APP_MODE_SOLVER_AERO = 4;
}

// Application operating dimension.
enum AppDimension {
  // Unspecified application dimension.
  APP_DIMENSION_UNSPECIFIED = 0;
  // Two dimensional.
  APP_DIMENSION_TWO = 1;
  // Three dimensional.
  APP_DIMENSION_THREE = 2;
}

// Application operating precision.
enum AppPrecision {
  // Unspecified application precision.
  APP_PRECISION_UNSPECIFIED = 0;
  // Single precision.
  APP_PRECISION_SINGLE = 1;
  // Double precision.
  APP_PRECISION_DOUBLE = 2;
}

// Application UI mode.
enum AppUIMode {
  // Unspecified application UI mode.
  APP_UI_MODE_UNSPECIFIED = 0;
  // No gui or graphics UI mode.
  APP_UI_MODE_NO_GUI_OR_GRAPHICS = 1;
  // No graphics UI mode.
  APP_UI_MODE_NO_GRAPHICS = 2;
  // No gui UI mode.
  APP_UI_MODE_NO_GUI = 3;
  // Hidden gui UI mode.
  APP_UI_MODE_HIDDEN_GUI = 4;
  // Gui UI mode.
  APP_UI_MODE_GUI = 5;
}

// Application graphics driver (Linux specific).
enum AppLinuxGraphicsDriver {
  // Unspecified graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_UNSPECIFIED = 0;
  // Null graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_NULL = 1;
  // X11 graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_X11 = 2;
  // OpenGL2 graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_OPENGL2 = 3;
  // OpenGL graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_OPENGL = 4;
  // Automatically choose graphics driver.
  APP_LINUX_GRAPHICS_DRIVER_AUTO = 5;
}

// Application graphics driver (Windows specific).
enum AppWindowsGraphicsDriver {
  // Unspecified graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_UNSPECIFIED = 0;
  // Null graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_NULL = 1;
  // MSW graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_MSW = 2;
  // DX11 graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_DX11 = 3;
  // OpenGL2 graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_OPENGL2 = 4;
  // OpenGL graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_OPENGL = 5;
  // Automatically choose graphics driver.
  APP_WINDOWS_GRAPHICS_DRIVER_AUTO = 6;
}
