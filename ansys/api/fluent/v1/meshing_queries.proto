syntax = "proto3";

package ansys.api.fluent.v1.meshing_queries;

import "common_api.proto";

// MeshingQueries provides mesh and object query operations.
service MeshingQueries {
  // Returns the face zone ID at the given location.
  rpc GetFaceZoneAtLocation(GetFaceZoneLocationRequest) returns (GetFaceZoneLocationResponse);
  // Returns the cell zone ID at the given location.
  rpc GetCellZoneAtLocation(GetCellZoneLocationRequest) returns (GetCellZoneLocationResponse);
  // Lists zone IDs matching the given type.
  rpc GetZonesOfType(GetZonesTypeRequest) returns (GetZonesTypeResponse);
  // Lists zone IDs belonging to the given group.
  rpc GetZonesOfGroup(GetZonesGroupRequest) returns (GetZonesGroupResponse);
  // Lists face zone IDs matching the filter.
  rpc GetFaceZonesOfFilter(GetFaceZonesFilterRequest) returns (GetFaceZonesFilterResponse);
  // Lists cell zone IDs matching the filter.
  rpc GetCellZonesOfFilter(GetCellZonesFilterRequest) returns (GetCellZonesFilterResponse);
  // Lists edge zone IDs matching the filter.
  rpc GetEdgeZonesOfFilter(GetEdgeZonesFilterRequest) returns (GetEdgeZonesFilterResponse);
  // Lists node zone IDs matching the filter.
  rpc GetNodeZonesOfFilter(GetNodeZonesFilterRequest) returns (GetNodeZonesFilterResponse);
  // Lists object names of the given type.
  rpc GetObjectsOfType(GetObjectsTypeRequest) returns (GetObjectsTypeResponse);
  // Lists face zone IDs referenced by the object.
  rpc GetFaceZoneIdListOfObject(GetFaceZoneIdListObjectRequest) returns (GetFaceZoneIdListObjectResponse);
  // Lists edge zone IDs referenced by the object.
  rpc GetEdgeZoneIdListOfObject(GetEdgeZoneIdListObjectRequest) returns (GetEdgeZoneIdListObjectResponse);
  // Lists cell zone IDs referenced by the object.
  rpc GetCellZoneIdListOfObject(GetCellZoneIdListObjectRequest) returns (GetCellZoneIdListObjectResponse);
  // Lists face zones shared by regions of the given type.
  rpc GetFaceZonesSharedByRegionsOfType(GetFaceZonesSharedRegionsTypeRequest) returns (GetFaceZonesSharedRegionsTypeResponse);
  // Lists face zones for the specified regions.
  rpc GetFaceZonesOfRegions(GetFaceZonesRegionsRequest) returns (GetFaceZonesRegionsResponse);
  // Lists face zones for the specified labels.
  rpc GetFaceZonesOfLabels(GetFaceZonesLabelsRequest) returns (GetFaceZonesLabelsResponse);
  // Lists face zone IDs for the specified labels.
  rpc GetFaceZoneIdListOfLabels(GetFaceZoneIdListLabelsRequest) returns (GetFaceZoneIdListLabelsResponse);
  // Lists face zones associated with the provided objects.
  rpc GetFaceZonesOfObjects(GetFaceZonesObjectsRequest) returns (GetFaceZonesObjectsResponse);
  // Lists edge zones associated with the provided objects.
  rpc GetEdgeZonesOfObjects(GetEdgeZonesObjectsRequest) returns (GetEdgeZonesObjectsResponse);
  // Lists face zone IDs for the specified regions.
  rpc GetFaceZoneIdListOfRegions(GetFaceZoneIdListRegionsRequest) returns (GetFaceZoneIdListRegionsResponse);
  // Lists prism cell zones matching the pattern or names.
  rpc GetPrismCellZones(GetPrismCellZonesRequest) returns (GetPrismCellZonesResponse);
  // Lists tetrahedral cell zones matching the pattern or names.
  rpc GetTetCellZones(GetTetCellZonesRequest) returns (GetTetCellZonesResponse);
  // Lists cell zones adjacent to the given face zones.
  rpc GetAdjacentCellZones(GetAdjacentCellZonesRequest) returns (GetAdjacentCellZonesResponse);
  // Lists face zones adjacent to the given cell zones.
  rpc GetAdjacentFaceZones(GetAdjacentFaceZonesRequest) returns (GetAdjacentFaceZonesResponse);
  // Lists adjacent interior and boundary face zones for the given cell zones.
  rpc GetAdjacentInteriorAndBoundaryFaceZones(GetAdjacentInteriorAndBoundaryFaceZonesRequest) returns (GetAdjacentInteriorAndBoundaryFaceZonesResponse);
  // Lists adjacent zones based on edge connectivity.
  rpc GetAdjacentZonesByEdgeConnectivity(GetAdjacentZonesEdgeConnectivityRequest) returns (GetAdjacentZonesEdgeConnectivityResponse);
  // Lists adjacent zones based on node connectivity.
  rpc GetAdjacentZonesByNodeConnectivity(GetAdjacentZonesNodeConnectivityRequest) returns (GetAdjacentZonesNodeConnectivityResponse);
  // Lists shared boundary zones for the given cell zones.
  rpc GetSharedBoundaryZones(GetSharedBoundaryZonesRequest) returns (GetSharedBoundaryZonesResponse);
  // Lists interior zones connected to the given cell zones.
  rpc GetInteriorZonesConnectedToCellZones(GetInteriorZonesConnectedCellZonesRequest) returns (GetInteriorZonesConnectedCellZonesResponse);
  // Lists face zones where zone-specific prisms are applied.
  rpc GetFaceZonesWithZoneSpecificPrismsApplied(Empty) returns (GetFaceZonesZoneSpecificPrismsAppliedResponse);
  // Lists face zones affected by prism controls.
  rpc GetFaceZonesOfPrismControls(GetFaceZonesPrismControlsRequest) returns (GetFaceZonesPrismControlsResponse);
  // Lists baffle zone IDs for the given face zones.
  rpc GetBaffles(GetBafflesRequest) returns (GetBafflesResponse);
  // Lists embedded baffle zone IDs.
  rpc GetEmbeddedBaffles(Empty) returns (GetEmbeddedBafflesResponse);
  // Lists wrapped face zone IDs.
  rpc GetWrappedZones(Empty) returns (GetWrappedZonesResponse);
  // Lists unreferenced edge zone IDs.
  rpc GetUnreferencedEdgeZones(Empty) returns (GetUnreferencedEdgeZonesResponse);
  // Lists unreferenced face zone IDs.
  rpc GetUnreferencedFaceZones(Empty) returns (GetUnreferencedFaceZonesResponse);
  // Lists unreferenced cell zone IDs.
  rpc GetUnreferencedCellZones(Empty) returns (GetUnreferencedCellZonesResponse);
  // Lists unreferenced edge zones matching a filter.
  rpc GetUnreferencedEdgeZonesOfFilter(GetUnreferencedEdgeZonesOfFilterRequest) returns (GetUnreferencedEdgeZonesOfFilterResponse);
  // Lists unreferenced face zones matching a filter.
  rpc GetUnreferencedFaceZonesOfFilter(GetUnreferencedFaceZonesOfFilterRequest) returns (GetUnreferencedFaceZonesOfFilterResponse);
  // Lists unreferenced cell zones matching a filter.
  rpc GetUnreferencedCellZonesOfFilter(GetUnreferencedCellZonesOfFilterRequest) returns (GetUnreferencedCellZonesOfFilterResponse);
  // Lists unreferenced edge zone IDs by pattern.
  rpc GetUnreferencedEdgeZoneIdListOfPattern(GetUnreferencedEdgeZoneIdListPatternRequest) returns (GetUnreferencedEdgeZoneIdListPatternResponse);
  // Lists unreferenced face zone IDs by pattern.
  rpc GetUnreferencedFaceZoneIdListOfPattern(GetUnreferencedFaceZoneIdListPatternRequest) returns (GetUnreferencedFaceZoneIdListPatternResponse);
  // Lists unreferenced cell zone IDs by pattern.
  rpc GetUnreferencedCellZoneIdListOfPattern(GetUnreferencedCellZoneIdListPatternRequest) returns (GetUnreferencedCellZoneIdListPatternResponse);
  // Returns the cell zone ID with the maximum volume.
  rpc GetMaxsizeCellZoneByVolume(GetMaxsizeCellZoneVolumeRequest) returns (GetMaxsizeCellZoneVolumeResponse);
  // Returns the cell zone ID with the maximum entity count.
  rpc GetMaxsizeCellZoneByCount(GetMaxsizeCellZoneCountRequest) returns (GetMaxsizeCellZoneCountResponse);
  // Returns the face zone ID with the minimum area.
  rpc GetMinsizeFaceZoneByArea(GetMinsizeFaceZoneAreaRequest) returns (GetMinsizeFaceZoneAreaResponse);
  // Returns the face zone ID with the minimum entity count.
  rpc GetMinsizeFaceZoneByCount(GetMinsizeFaceZoneCountRequest) returns (GetMinsizeFaceZoneCountResponse);
  // Lists face zone IDs by maximum entity count.
  rpc GetFaceZoneListByMaximumEntityCount(GetFaceZoneListMaximumEntityCountRequest) returns (GetFaceZoneListMaximumEntityCountResponse);
  // Lists edge zone IDs by maximum entity count.
  rpc GetEdgeZoneListByMaximumEntityCount(GetEdgeZoneListMaximumEntityCountRequest) returns (GetEdgeZoneListMaximumEntityCountResponse);
  // Lists cell zone IDs by maximum entity count.
  rpc GetCellZoneListByMaximumEntityCount(GetCellZoneListMaximumEntityCountRequest) returns (GetCellZoneListMaximumEntityCountResponse);
  // Lists face zone IDs by maximum zone area.
  rpc GetFaceZoneListByMaximumZoneArea(GetFaceZoneListMaximumZoneAreaRequest) returns (GetFaceZoneListMaximumZoneAreaResponse);
  // Lists face zone IDs by minimum zone area.
  rpc GetFaceZoneListByMinimumZoneArea(GetFaceZoneListMinimumZoneAreaRequest) returns (GetFaceZoneListMinimumZoneAreaResponse);
  // Lists zones with free faces.
  rpc GetZonesWithFreeFaces(GetZonesFreeFacesRequest) returns (GetZonesFreeFacesResponse);
  // Lists zones with multiple connected faces.
  rpc GetZonesWithMultiFaces(GetZonesMultiFacesRequest) returns (GetZonesMultiFacesResponse);
  // Lists overlapping face zone IDs with tolerances.
  rpc GetOverlappingFaceZones(GetOverlappingFaceZonesRequest) returns (GetOverlappingFaceZonesResponse);
  // Lists zones that have marked faces.
  rpc GetZonesWithMarkedFaces(GetZonesMarkedFacesRequest) returns (GetZonesMarkedFacesResponse);
  // Lists all object names.
  rpc GetAllObjectNameList(Empty) returns (GetAllObjectNameListResponse);
  // Lists object names of the given type.
  rpc GetObjectNameListOfType(GetObjectNameListTypeRequest) returns (GetObjectNameListTypeResponse);
  // Lists objects matching the filter.
  rpc GetObjectsOfFilter(GetObjectsFilterRequest) returns (GetObjectsFilterResponse);
  // Lists regions belonging to an object.
  rpc GetRegionsOfObject(GetRegionsObjectRequest) returns (GetRegionsObjectResponse);
  // Lists region names belonging to an object.
  rpc GetRegionNameListOfObject(GetRegionNameListObjectRequest) returns (GetRegionNameListObjectResponse);
  // Sorts regions by volume.
  rpc SortRegionsByVolume(SortRegionsVolumeRequest) returns (SortRegionsVolumeResponse);
  // Returns the volume of the specified region.
  rpc GetRegionVolume(GetRegionVolumeRequest) returns (GetRegionVolumeResponse);
  // Lists regions matching a filter.
  rpc GetRegionsOfFilter(GetRegionsFilterRequest) returns (GetRegionsFilterResponse);
  // Lists region names matching a pattern.
  rpc GetRegionNameListOfPattern(GetRegionNameListPatternRequest) returns (GetRegionNameListPatternResponse);
  // Lists regions associated with the given face zones.
  rpc GetRegionsOfFaceZones(GetRegionsFaceZonesRequest) returns (GetRegionsFaceZonesResponse);
  // Lists region names associated with the given face zones.
  rpc GetRegionNameListOfFaceZones(GetRegionNameListFaceZonesRequest) returns (GetRegionNameListFaceZonesResponse);
  // Finds join pairs between face zones based on overlap.
  rpc FindJoinPairs(FindJoinPairsRequest) returns (FindJoinPairsResponse);
}

// Empty message used for RPCs that do not require parameters.
message Empty {
}

// Request for face zone at a spatial location.
message GetFaceZoneLocationRequest {
  ansys.api.fluent.v1.common_api.Point location = 1;  // Query location as a 3D point.
}

// Response containing the face zone id at a location.
message GetFaceZoneLocationResponse {
  sint64 face_zone_id = 1;  // Face zone ID at the location.
}

// Request for cell zone at a spatial location.
message GetCellZoneLocationRequest {
  ansys.api.fluent.v1.common_api.Point location = 1;  // Query location as a 3D point.
}

// Response containing the cell zone id at a location.
message GetCellZoneLocationResponse {
  sint64 cell_zone_id = 1;  // Cell zone ID at the location.
}

// Request to get zones of a given type.
message GetZonesTypeRequest {
  string type = 1;  // Zone type name.
}

// Response listing zone ids of the requested type.
message GetZonesTypeResponse {
  repeated sint64 zone_ids = 1;  // IDs of zones matching the type.
}

// Request to get zones belonging to a group.
message GetZonesGroupRequest {
  string group = 1;  // Group name.
}

// Response listing zone ids of the requested group.
message GetZonesGroupResponse {
  repeated sint64 zone_ids = 1;  // IDs of zones in the group.
}

// Request to get face zones matching a filter.
message GetFaceZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing face zone ids matching a filter.
message GetFaceZonesFilterResponse {
  repeated sint64 face_zone_ids = 1;  // IDs of face zones matching the filter.
}

// Request to get cell zones matching a filter.
message GetCellZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing cell zone ids matching a filter.
message GetCellZonesFilterResponse {
  repeated sint64 cell_zone_ids = 1;  // IDs of cell zones matching the filter.
}

// Request to get edge zones matching a filter.
message GetEdgeZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing edge zone ids matching a filter.
message GetEdgeZonesFilterResponse {
  repeated sint64 edge_zone_ids = 1;  // IDs of edge zones matching the filter.
}

// Request to get node zones matching a filter.
message GetNodeZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing node zone ids matching a filter.
message GetNodeZonesFilterResponse {
  repeated sint64 node_zone_ids = 1;  // IDs of node zones matching the filter.
}

// Request to get objects of a given type.
message GetObjectsTypeRequest {
  string type = 1;  // Object type name.
}

// Response listing object names of a given type.
message GetObjectsTypeResponse {
  repeated string objects = 1;  // Object names of the given type.
}

// Request to get face zone ids from an object.
message GetFaceZoneIdListObjectRequest {
  string object = 1;  // Object name.
}

// Response listing face zone ids for an object.
message GetFaceZoneIdListObjectResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs referenced by the object.
}

// Request to get edge zone ids from an object.
message GetEdgeZoneIdListObjectRequest {
  string object = 1;  // Object name.
}

// Response listing edge zone ids for an object.
message GetEdgeZoneIdListObjectResponse {
  repeated sint64 edge_zone_ids = 1;  // Edge zone IDs referenced by the object.
}

// Request to get cell zone ids from an object.
message GetCellZoneIdListObjectRequest {
  string object = 1;  // Object name.
}

// Response listing cell zone ids for an object.
message GetCellZoneIdListObjectResponse {
  repeated sint64 cell_zone_ids = 1;  // Cell zone IDs referenced by the object.
}

// Request to get face zones shared by regions of a given type.
message GetFaceZonesSharedRegionsTypeRequest {
  string mesh_object = 1;  // Mesh object name.
  string region_type = 2;  // Region type name.
}

// Response listing shared face zone ids.
message GetFaceZonesSharedRegionsTypeResponse {
  repeated sint64 shared_face_zone_ids = 1;  // Shared face zone IDs.
}

// Request to get face zones of regions.
message GetFaceZonesRegionsRequest {
  string object = 1;            // Object name.
  repeated string regions = 2;  // Region names.
}

// Response listing face zone ids of regions.
message GetFaceZonesRegionsResponse {
  repeated sint64 zone_ids = 1;  // Face zone IDs.
}

// Request to get face zones of labels.
message GetFaceZonesLabelsRequest {
  string object = 1;           // Object name.
  repeated string labels = 2;  // Label names.
}

// Response listing face zone ids of labels.
message GetFaceZonesLabelsResponse {
  repeated sint64 zone_ids = 1;  // Face zone IDs.
}

// Request to get face zone ids of labels.
message GetFaceZoneIdListLabelsRequest {
  string object = 1;           // Object name.
  repeated string labels = 2;  // Label names.
}

// Response listing face zone ids of labels.
message GetFaceZoneIdListLabelsResponse {
  repeated sint64 zone_ids = 1;  // Face zone IDs.
}

// Request to get face zones of objects.
message GetFaceZonesObjectsRequest {
  repeated string object_lists = 1;  // Object names.
}

// Response listing face zone ids of objects.
message GetFaceZonesObjectsResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs.
}

// Request to get edge zones of objects.
message GetEdgeZonesObjectsRequest {
  repeated string object_lists = 1;  // Object names.
}

// Response listing edge zone ids of objects.
message GetEdgeZonesObjectsResponse {
  repeated sint64 edge_zone_ids = 1;  // Edge zone IDs.
}

// Request to get face zone ids of regions.
message GetFaceZoneIdListRegionsRequest {
  string object = 1;           // Object name.
  repeated string labels = 2;  // Region labels.
}

// Response listing face zone ids of regions.
message GetFaceZoneIdListRegionsResponse {
  repeated sint64 zone_ids = 1;  // Face zone IDs.
}

// Request to get prism cell zones.
message GetPrismCellZonesRequest {
  string zone_name_or_pattern = 1;  // Zone name or pattern.
  repeated string zones = 2;        // Explicit zone names.
}

// Response listing prism cell zone ids.
message GetPrismCellZonesResponse {
  repeated sint64 prism_cell_zones = 1;  // Prism cell zone IDs.
}

// Request to get tetrahedral cell zones.
message GetTetCellZonesRequest {
  string zone_name_or_pattern = 1;  // Zone name or pattern.
  repeated string zones = 2;        // Explicit zone names.
}

// Response listing tetrahedral cell zone ids.
message GetTetCellZonesResponse {
  repeated sint64 tet_cell_zones = 1;  // Tetrahedral cell zone IDs.
}

// Request to get adjacent cell zones.
message GetAdjacentCellZonesRequest {
  string zone_name_or_pattern = 1;    // Zone name or pattern.
  repeated sint64 face_zone_ids = 2;  // Face zone IDs.
}

// Response listing adjacent cell zone ids.
message GetAdjacentCellZonesResponse {
  repeated sint64 adjacent_cell_zones = 1;  // Adjacent cell zone IDs.
}

// Request to get adjacent face zones.
message GetAdjacentFaceZonesRequest {
  string zone_name_or_pattern = 1;    // Zone name or pattern.
  repeated sint64 cell_zone_ids = 2;  // Cell zone IDs.
}

// Response listing adjacent boundary face zone ids.
message GetAdjacentFaceZonesResponse {
  repeated sint64 adjacent_boundary_face_zones = 1;  // Adjacent boundary face zone IDs.
}

// Request to get adjacent interior and boundary face zones.
message GetAdjacentInteriorAndBoundaryFaceZonesRequest {
  string zone_name_or_pattern = 1;    // Zone name or pattern.
  repeated sint64 cell_zone_ids = 2;  // Cell zone IDs.
}

// Response listing adjacent interior and boundary face zone ids.
message GetAdjacentInteriorAndBoundaryFaceZonesResponse {
  repeated sint64 adjacent_interior_and_boundary_face_zones = 1;  // Adjacent interior and boundary face zone IDs.
}

// Request to get adjacent zones by edge connectivity.
message GetAdjacentZonesEdgeConnectivityRequest {
  string zone_name_or_pattern = 1;  // Zone name or pattern.
  repeated sint64 zone_ids = 2;     // Zone IDs.
}

// Response listing adjacent zone ids by edge connectivity.
message GetAdjacentZonesEdgeConnectivityResponse {
  repeated sint64 adjacent_zone_ids = 1;  // Adjacent zone IDs by edge connectivity.
}

// Request to get adjacent zones by node connectivity.
message GetAdjacentZonesNodeConnectivityRequest {
  string zone_name_or_pattern = 1;  // Zone name or pattern.
  repeated sint64 zone_ids = 2;     // Zone IDs.
}

// Response listing adjacent zone ids by node connectivity.
message GetAdjacentZonesNodeConnectivityResponse {
  repeated sint64 adjacent_zone_ids = 1;  // Adjacent zone IDs by node connectivity.
}

// Request to get shared boundary zones.
message GetSharedBoundaryZonesRequest {
  string cell_zone_name_or_pattern = 1;  // Cell zone name or pattern.
  repeated sint64 cell_zone_ids = 2;     // Cell zone IDs.
}

// Response listing shared boundary zone ids.
message GetSharedBoundaryZonesResponse {
  repeated sint64 shared_boundary_zone_ids = 1;  // Shared boundary zone IDs.
}

// Request to get interior zones connected to cell zones.
message GetInteriorZonesConnectedCellZonesRequest {
  string cell_zone_name_or_pattern = 1;  // Cell zone name or pattern.
  repeated sint64 face_zone_ids = 2;     // Face zone IDs.
}

// Response listing interior zone ids connected to cell zones.
message GetInteriorZonesConnectedCellZonesResponse {
  repeated sint64 interior_zone_ids = 1;  // Interior zone IDs.
}

// Response listing face zones with zone-specific prisms applied.
message GetFaceZonesZoneSpecificPrismsAppliedResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs with zone-specific prisms.
}

// Request to get face zones affected by prism controls.
message GetFaceZonesPrismControlsRequest {
  string control_name = 1;  // Prism control name.
}

// Response listing face zones affected by prism controls.
message GetFaceZonesPrismControlsResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs affected by prism controls.
}

// Request to get baffles for face zones.
message GetBafflesRequest {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs.
}

// Response listing baffle zone ids.
message GetBafflesResponse {
  repeated sint64 baffle_zone_ids = 1;  // Baffle zone IDs.
}

// Response listing embedded baffles zone ids.
message GetEmbeddedBafflesResponse {
  repeated sint64 embedded_baffles_zone_ids = 1;  // Embedded baffle zone IDs.
}

// Response listing wrapped face zone ids.
message GetWrappedZonesResponse {
  repeated sint64 wrapped_face_zone_ids = 1;  // Wrapped face zone IDs.
}

// Response listing unreferenced edge zone ids.
message GetUnreferencedEdgeZonesResponse {
  repeated sint64 unreferenced_edge_zone_ids = 1;  // Unreferenced edge zone IDs.
}

// Response listing unreferenced face zone ids.
message GetUnreferencedFaceZonesResponse {
  repeated sint64 unreferenced_face_zone_ids = 1;  // Unreferenced face zone IDs.
}

// Response listing unreferenced cell zone ids.
message GetUnreferencedCellZonesResponse {
  repeated sint64 unreferenced_cell_zone_ids = 1;  // Unreferenced cell zone IDs.
}

// Request to get unreferenced edge zones of a filter.
message GetUnreferencedEdgeZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing unreferenced edge zone ids of a filter.
message GetUnreferencedEdgeZonesFilterResponse {
  repeated sint64 unreferenced_edge_zone_ids = 1;  // Unreferenced edge zone IDs matching the filter.
}

// Request to get unreferenced face zones of a filter.
message GetUnreferencedFaceZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing unreferenced face zone ids of a filter.
message GetUnreferencedFaceZonesFilterResponse {
  repeated sint64 unreferenced_face_zone_ids = 1;  // Unreferenced face zone IDs matching the filter.
}

// Request to get unreferenced cell zones of a filter.
message GetUnreferencedCellZonesFilterRequest {
  string filter = 1;  // Filter expression.
}

// Response listing unreferenced cell zone ids of a filter.
message GetUnreferencedCellZonesFilterResponse {
  repeated sint64 unreferenced_cell_zone_ids = 1;  // Unreferenced cell zone IDs matching the filter.
}

// Request to get unreferenced edge zone ids by pattern.
message GetUnreferencedEdgeZoneIdListPatternRequest {
  string pattern = 1;  // Name pattern.
}

// Response listing unreferenced edge zone ids by pattern.
message GetUnreferencedEdgeZoneIdListPatternResponse {
  repeated sint64 unreferenced_edge_zone_ids = 1;  // Unreferenced edge zone IDs matching the pattern.
}

// Request to get unreferenced face zone ids by pattern.
message GetUnreferencedFaceZoneIdListPatternRequest {
  string pattern = 1;  // Name pattern.
}

// Response listing unreferenced face zone ids by pattern.
message GetUnreferencedFaceZoneIdListPatternResponse {
  repeated sint64 unreferenced_face_zone_ids = 1;  // Unreferenced face zone IDs matching the pattern.
}

// Request to get unreferenced cell zone ids by pattern.
message GetUnreferencedCellZoneIdListPatternRequest {
  string pattern = 1;  // Name pattern.
}

// Response listing unreferenced cell zone ids by pattern.
message GetUnreferencedCellZoneIdListPatternResponse {
  repeated sint64 unreferenced_cell_zone_ids = 1;  // Unreferenced cell zone IDs matching the pattern.
}

// Request to get the cell zone with the maximum volume.
message GetMaxsizeCellZoneVolumeRequest {
  string cell_zone_pattern = 1;         // Cell zone name pattern.
  repeated sint64 cell_zone_ids = 2;    // Candidate cell zone IDs.
  repeated string cell_zone_names = 3;  // Candidate cell zone names.
}

// Response containing the cell zone id with the maximum volume.
message GetMaxsizeCellZoneVolumeResponse {
  sint64 cell_zone_id = 1;  // Cell zone ID with maximum volume.
}

// Request to get the cell zone with the maximum entity count.
message GetMaxsizeCellZoneCountRequest {
  string cell_zone_pattern = 1;         // Cell zone name pattern.
  repeated sint64 cell_zone_ids = 2;    // Candidate cell zone IDs.
  repeated string cell_zone_names = 3;  // Candidate cell zone names.
}

// Response containing the cell zone id with the maximum entity count.
message GetMaxsizeCellZoneCountResponse {
  sint64 cell_zone_id = 1;  // Cell zone ID with maximum entity count.
}

// Request to get the face zone with the minimum area.
message GetMinsizeFaceZoneAreaRequest {
  string face_zone_pattern = 1;         // Face zone name pattern.
  repeated sint64 face_zone_ids = 2;    // Candidate face zone IDs.
  repeated string face_zone_names = 3;  // Candidate face zone names.
}

// Response containing the face zone id with the minimum area.
message GetMinsizeFaceZoneAreaResponse {
  sint64 face_zone_id = 1;  // Face zone ID with minimum area.
}

// Request to get the face zone with the minimum entity count.
message GetMinsizeFaceZoneCountRequest {
  string face_zone_pattern = 1;         // Face zone name pattern.
  repeated sint64 face_zone_ids = 2;    // Candidate face zone IDs.
  repeated string face_zone_names = 3;  // Candidate face zone names.
}

// Response containing the face zone id with the minimum entity count.
message GetMinsizeFaceZoneCountResponse {
  sint64 face_zone_id = 1;  // Face zone ID with minimum entity count.
}

// Request to list face zones by maximum entity count.
message GetFaceZoneListMaximumEntityCountRequest {
  sint64 maximum_entity_count = 1;  // Maximum allowed entity count.
  bool only_boundary = 2;           // If true, only include boundary zones.
}

// Response listing face zone ids by maximum entity count.
message GetFaceZoneListMaximumEntityCountResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs.
}

// Request to list edge zones by maximum entity count.
message GetEdgeZoneListMaximumEntityCountRequest {
  sint64 maximum_entity_count = 1;  // Maximum allowed entity count.
  bool only_boundary = 2;           // If true, only include boundary zones.
}

// Response listing edge zone ids by maximum entity count.
message GetEdgeZoneListMaximumEntityCountResponse {
  repeated sint64 edge_zone_ids = 1;  // Edge zone IDs.
}

// Request to list cell zones by maximum entity count.
message GetCellZoneListMaximumEntityCountRequest {
  sint64 maximum_entity_count = 1;  // Maximum allowed entity count.
}

// Response listing cell zone ids by maximum entity count.
message GetCellZoneListMaximumEntityCountResponse {
  repeated sint64 cell_zone_ids = 1;  // Cell zone IDs.
}

// Request to list face zones by maximum zone area.
message GetFaceZoneListMaximumZoneAreaRequest {
  sint64 maximum_zone_area = 1;  // Maximum zone area.
}

// Response listing face zone ids by maximum zone area.
message GetFaceZoneListMaximumZoneAreaResponse {
  repeated sint64 face_zone_ids = 1;  // Face zone IDs.
}

// Request to list face zones by minimum zone area.
message GetFaceZoneListMinimumZoneAreaRequest {
  sint64 minimum_zone_area = 1;  // Minimum zone area.
}

// Response listing face zone ids by minimum zone area.
message GetFaceZoneListMinimumZoneAreaResponse {
