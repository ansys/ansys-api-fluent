syntax = "proto3";

package ansys.api.fluent.v1.settings;

// Settings service provides RPCs for reading, writing, and commanding the Fluent
// solver settings hierarchy. It operates exclusively on the solver: every PathInfo
// must use root="fluent".
service Settings {
  /* Return the API schema for the settings hierarchy, describing object types, children, commands, queries, and arguments. */
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  /* Return the current state of the settings object at the specified path. */
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  /* Update the state of the settings object at the specified path. */
  rpc SetState(SetStateRequest) returns (SetStateResponse);

  /* Rename the named object at the specified path. */
  rpc Rename(RenameRequest) returns (RenameResponse);

  /* Create a new named object at the specified path. */
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);

  /* Delete the named object at the specified path. */
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  /* Return the names of all named objects at the specified path. */
  rpc GetObjectNames(GetObjectNamesRequest) returns (GetObjectNamesResponse);

  /* Return the number of elements in the list object at the specified path. */
  rpc GetListSize(GetListSizeRequest) returns (GetListSizeResponse);

  /* Resize the list object at the specified path. */
  rpc ResizeListObject(ResizeListObjectRequest) returns (ResizeListObjectResponse);

  /* Execute the named command on the settings object at the specified path. */
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  /* Execute the named query on the settings object at the specified path and return the result. */
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);

  /* Return named attributes of the settings object at the specified path. */
  rpc GetAttrs(GetAttrsRequest) returns (GetAttrsResponse);

  /* Return whether the provided string is treated as a wildcard by the solver. */
  rpc IsWildcard(IsWildcardRequest) returns (IsWildcardResponse);
}

// Value represents the state of a settings object, as returned by GetState and accepted by SetState.
message Value {
  // ValueList represents a list of Value objects
  message ValueList {
    repeated Value lsts = 1;  // The list of values
  };
  // ValueMap represents a map with string keys and Value values
  message ValueMap {
    map<string, Value> m = 1;  // The map entries
  };
  oneof value {
    bool boolean = 2;           // Boolean value
    int64 integer = 3;          // Integer value
    double real = 4;            // Real (double-precision floating-point) value
    string string = 5;          // String value
    ValueList value_list = 10;  // List of values
    ValueMap value_map = 11;    // Map of values
  };
}

// PathInfo represents the location of a settings object in the hierarchy.
message PathInfo {
  string root = 1;  // The root of the settings tree.
  string path = 2;  // The path to the object from the root.
}

// SchemaMap represents a named entry in the settings API schema.
message SchemaMap {
  string name = 1;   // The name of the entry.
  Schema value = 2;  // The schema information for this entry.
}

// Schema contains the static API description of a settings object, including its type, children, commands, and queries.
message Schema {
  // Type identifier for the current object (for example, "group" or "named-object").
  string type = 1;
  // Children of the current object.
  repeated SchemaMap children = 2;
  // Commands available for the current object.
  repeated SchemaMap commands = 3;
  // Arguments associated with the current command or query object.
  repeated SchemaMap arguments = 4;
  // Class template for a named-object instance.
  Schema object_type = 5;
  // Help text for the current object.
  string help = 6;
  // True if the current object restricts its value to an allowed-values list.
  bool has_allowed_values = 7;
  // True if named-object instances of child objects are also accessible on this object (for example, on boundary_conditions).
  bool include_child_named_objects = 8;
  // Fixed size of the list object; zero for variable-length lists.
  int32 list_size = 9;
  // True if the user can create new instances of this named object.
  bool user_creatable = 10;
  // Queries available for the current object.
  repeated SchemaMap queries = 11;
  // Additional attributes for the current object.
  map<string, Value> attrs = 12;
}

// GetSchemaRequest is the request message for GetSchema.
message GetSchemaRequest {
  string root = 1;                     // The root of the settings tree to retrieve the schema for.
  repeated string optional_attrs = 2;  // Optional attribute names to include in the schema response.
}

// GetSchemaResponse is the response message for GetSchema.
message GetSchemaResponse {
  Schema info = 1;  // The API schema for the requested settings tree root.
}

// GetStateRequest is the request message for GetState.
message GetStateRequest {
  PathInfo path_info = 1;  // The path to the settings object whose current state to retrieve.
}

// GetStateResponse is the response message for GetState.
message GetStateResponse {
  Value value = 1;  // The current state of the settings object at the requested path.
}

// SetStateRequest is the request message for SetState.
message SetStateRequest {
  PathInfo path_info = 1;  // The path to the settings object whose state to update.
  Value value = 2;         // The new state for the settings object.
}

// SetStateResponse is the response message for SetState.
message SetStateResponse {
}

// CreateObjectRequest is the request message for creating a new object
message CreateObjectRequest {
  PathInfo path_info = 1;  // The path where the new object should be created
  string name = 2;         // The name of the new object to create
}

// CreateObjectResponse is the response message for a create object operation
message CreateObjectResponse {
}

// RenameRequest is the request message for renaming an object
message RenameRequest {
  PathInfo path_info = 1;  // The path containing the object to rename
  string old_name = 2;     // The current name of the object
  string new_name = 3;     // The new name for the object
}

// RenameResponse is the response message for a rename object operation
message RenameResponse {
}

// DeleteObjectRequest is the request message for deleting an object
message DeleteObjectRequest {
  PathInfo path_info = 1;  // The path containing the object to delete
  string name = 2;         // The name of the object to delete
}

// DeleteObjectResponse is the response message for a delete object operation
message DeleteObjectResponse {
}

// GetObjectNamesRequest is the request message for retrieving object names
message GetObjectNamesRequest {
  PathInfo path_info = 1;  // The path to retrieve object names from
}

// GetObjectNamesResponse is the response message containing object names
message GetObjectNamesResponse {
  repeated string names = 1;  // The list of object names at the specified path
}

// GetListSizeRequest is the request message for retrieving the size of a list object
message GetListSizeRequest {
  PathInfo path_info = 1;  // The path to the list object
}

// GetListSizeResponse is the response message containing the list size
message GetListSizeResponse {
  int32 size = 1;  // The number of elements in the list
}

// ResizeListObjectRequest is the request message for resizing a list object
message ResizeListObjectRequest {
  PathInfo path_info = 1;  // The path to the list object to resize
  int32 size = 2;          // The new size for the list
}

// ResizeListObjectResponse is the response message for a resize list object operation
message ResizeListObjectResponse {
}

// ExecuteCommandRequest is the request message for executing a command
message ExecuteCommandRequest {
  PathInfo path_info = 1;  // The path to the object on which to execute the command
  string command = 2;      // The name of the command to execute
  Value args = 3;          // Arguments to pass to the command
}

// ExecuteCommandResponse is the response message containing command execution results
message ExecuteCommandResponse {
  Value reply = 1;  // The return value from the executed command
}

// ExecuteQueryRequest is the request message for executing a query
message ExecuteQueryRequest {
  PathInfo path_info = 1;  // The path to the object on which to execute the query
  string query = 2;        // The name of the query to execute
  Value args = 3;          // Arguments to pass to the query
}

// ExecuteQueryResponse is the response message containing query execution results
message ExecuteQueryResponse {
  Value reply = 1;  // The return value from the executed query
}

// GetAttrsRequest is the request message for retrieving attributes
message GetAttrsRequest {
  PathInfo path_info = 1;     // The path to the object to retrieve attributes from
  repeated string attrs = 2;  // The list of attribute names to retrieve
  bool recursive = 3;         // Whether to retrieve attributes recursively from child objects
}

// AttrInfoMap represents a named entry in attribute information maps
message AttrInfoMap {
  string name = 1;             // The name of the child object
  GetAttrsResponse value = 2;  // The attribute information for this child object
}

// GetAttrsResponse is the response message containing attribute values
message GetAttrsResponse {
  Value values = 1;                         // The attribute values for the requested object
  repeated AttrInfoMap group_children = 2;  // Attribute information for child objects (when recursive is true)
}

// IsWildcardRequest is the request message for IsWildcard.
message IsWildcardRequest {
  string input = 1;  // The string to test.
}

// IsWildcardResponse is the response message for IsWildcard.
message IsWildcardResponse {
  bool is_wildcard = 1;  // True if the input string is treated as a wildcard by the solver.
}
