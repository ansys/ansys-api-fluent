syntax = "proto3";

package ansys.api.fluent.v1.primitives;

// Point represents a 3D Cartesian coordinate.
message Point {
  // X-axis coordinate.
  double x = 1;

  // Y-axis coordinate.
  double y = 2;

  // Z-axis coordinate.
  double z = 3;
}
