syntax = "proto3";

package ansys.api.fluent.v1.object_model;

import "ansys/api/fluent/v1/variant.proto";

// ObjectModel service provides a way to access some Fluent features like
// meshing, workflow, preferences, and other specific areas. The rules string
// in each request selects the target feature area.
// Supported rules contexts are:
//
// - ``meshing_workflow``: The most up-to-date, intuitive exposure of meshing workflow.
//
// - ``meshing_utilities``: Meshing queries and other utilities.
//
// - ``solver_workflow``: Solver workflows.
//
// - ``preferences``: Fluent preferences in both meshing and solution mode.
//
// - ``workflow``: Legacy exposure of the workflow component of meshing workflow.
//
// - ``meshing``: Legacy exposure of the meshing component of meshing workflow.
//
// - ``part_management``: Legacy exposure of the part management component of meshing workflow.
//
// - ``pm_file_management``: Legacy exposure of the part management - file-management component of meshing workflow.
//
// Note: StreamStateChanges is not supported for the "meshing_workflow" context.
service ObjectModel {
  // Streams state changes and events.
  // This method is not supported for the "meshing_workflow" rules context.
  rpc StreamStateChanges(StreamStateChangesRequest) returns (stream StreamStateChangesResponse) {}
  // Returns the current state at the specified path.
  rpc GetState(GetStateRequest) returns (GetStateResponse) {}
  // Sets the state at the specified path.
  rpc SetState(SetStateRequest) returns (SetStateResponse) {}
  // Merges a dictionary of values into the state at the specified path.
  rpc UpdateDict(UpdateDictRequest) returns (UpdateDictResponse) {}
  // Creates a new named object at the specified path.
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse) {}
  // Deletes the object at the specified path.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse) {}
  // Returns the value of a named attribute for the object at the specified path.
  rpc GetAttributeValue(GetAttributeValueRequest) returns (GetAttributeValueResponse) {}
  // Executes a command on the object at the specified path.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse) {}
  // Executes a query on the object at the specified path and returns the result.
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse) {}
  // Creates a command arguments object for the specified command.
  rpc CreateCommandArguments(CreateCommandArgumentsRequest) returns (CreateCommandArgumentsResponse) {}
  // Deletes a created command arguments object.
  rpc DeleteCommandArguments(DeleteCommandArgumentsRequest) returns (DeleteCommandArgumentsResponse) {}
  // Returns the API schema describing the structure of the object model.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {}
  // Renames the object at the specified path.
  rpc Rename(RenameRequest) returns (RenameResponse) {}
  // Fixes the state of the object at the specified path to ensure internal consistency.
  rpc FixState(FixStateRequest) returns (FixStateResponse) {}
  // Returns the names of all objects at the specified path.
  rpc GetObjectNames(GetObjectNamesRequest) returns (GetObjectNamesResponse) {}
  // Deletes all child objects of the parent object at the specified path.
  rpc DeleteChildObjects(DeleteChildObjectsRequest) returns (DeleteChildObjectsResponse) {}
  // Subscribes to one or more events.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (SubscribeEventsResponse) {}
  // Unsubscribes from subscribed events.
  rpc UnsubscribeEvents(UnsubscribeEventsRequest) returns (UnsubscribeEventsResponse) {}
  // Streams subscribed events.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse) {}
}

// DiffState specifies the level of detail for state differences
enum DiffState {
  DIFF_STATE_UNSPECIFIED = 0;  // Unspecified diff state
  DIFF_STATE_FULL = 1;         // Full state including commands
  DIFF_STATE_NOCOMMANDS = 2;   // State without commands
}

// StreamStateChangesRequest is the request message for initiating state streaming
message StreamStateChangesRequest {
  string rules = 1;               // The rules context for the streaming operation
  bool return_state_changes = 2;  // If true, returns state changes in the stream.
  DiffState diff_state = 3;       // The level of detail for state differences
}

// StreamStateChangesResponse is the streaming response containing state updates
message StreamStateChangesResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The current state or state changes
  repeated string deleted_paths = 2;              // Paths of deleted objects
  repeated string events = 3;                     // Events that occurred
}

// GetStateRequest is the request message for retrieving state
message GetStateRequest {
  string rules = 1;  // The rules context for the state query
  string path = 2;   // The path to retrieve state from
}

// GetStateResponse is the response message containing the requested state
message GetStateResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The state at the requested path
}

// SetStateRequest is the request message for setting state
message SetStateRequest {
  string rules = 1;                               // The rules context for the state update
  string path = 2;                                // The path where state should be set
  ansys.api.fluent.v1.variant.Variant state = 3;  // The new state to set
  bool wait = 4;                                  // If true, waits for the operation to complete before returning.
}

// SetStateResponse is the response message containing the updated state
message SetStateResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after the operation
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// UpdateDictRequest is the request message for updating a dictionary
message UpdateDictRequest {
  string rules = 1;                                    // The rules context for the update
  string path = 2;                                     // The path to the dictionary to update
  ansys.api.fluent.v1.variant.Variant merge_dict = 3;  // The dictionary values to merge
  bool wait = 4;                                       // If true, waits for the operation to complete before returning.
  bool recursive = 5;                                  // If true, updates recursively.
}

// UpdateDictResponse is the response message containing the updated state
message UpdateDictResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after the dictionary merge
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// CreateObjectRequest is the request message for creating a new named object
message CreateObjectRequest {
  string rules = 1;  // The rules context for the creation
  string path = 2;   // The path to the parent object
  string name = 3;   // The name of the new object to create
  bool wait = 4;     // If true, waits for the operation to complete before returning.
}

// CreateObjectResponse is the response message after creating a new named object
message CreateObjectResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after creation
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// DeleteObjectRequest is the request message for deleting an object
message DeleteObjectRequest {
  string rules = 1;  // The rules context for the deletion
  string path = 2;   // The path to the object to delete
  bool wait = 3;     // If true, waits for the operation to complete before returning.
}

// DeleteObjectResponse is the response message after deleting an object
message DeleteObjectResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after deletion
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// GetAttributeValueRequest is the request message for retrieving an attribute value
message GetAttributeValueRequest {
  string rules = 1;      // The rules context for the attribute query
  string path = 2;       // The path to the object
  string attribute = 3;  // The name of the attribute to retrieve
}

// GetAttributeValueResponse is the response message containing the attribute value
message GetAttributeValueResponse {
  ansys.api.fluent.v1.variant.Variant result = 1;  // The value of the requested attribute
}

// ExecuteCommandRequest is the request message for executing a command
message ExecuteCommandRequest {
  string rules = 1;                              // The rules context for command execution
  string path = 2;                               // The path to the object with the command
  string command = 3;                            // The name of the command to execute
  bool wait = 4;                                 // If true, waits for the command to complete before returning.
  ansys.api.fluent.v1.variant.Variant args = 5;  // Arguments to pass to the command
}

// ExecuteCommandResponse is the response message containing command execution results
message ExecuteCommandResponse {
  ansys.api.fluent.v1.variant.Variant result = 1;  // The return value from the command
  ansys.api.fluent.v1.variant.Variant state = 2;   // The updated state after command execution
  repeated string deleted_paths = 3;               // Paths of deleted objects
}

// ExecuteQueryRequest is the request message for executing a query
message ExecuteQueryRequest {
  string rules = 1;                              // The rules context for query execution
  string path = 2;                               // The path to the object with the query
  string query = 3;                              // The name of the query to execute
  ansys.api.fluent.v1.variant.Variant args = 4;  // Arguments to pass to the query
}

// ExecuteQueryResponse is the response message containing query execution results
message ExecuteQueryResponse {
  ansys.api.fluent.v1.variant.Variant result = 1;  // The return value from the query
}

// CreateCommandArgumentsRequest is the request message for creating command arguments
message CreateCommandArgumentsRequest {
  string rules = 1;    // The rules context for the operation
  string path = 2;     // The path to the object with the command
  string command = 3;  // The name of the command
}

// CreateCommandArgumentsResponse is the response message containing the command ID
message CreateCommandArgumentsResponse {
  string command_id = 1;  // The unique identifier for the created command arguments
}

// DeleteCommandArgumentsRequest is the request message for deleting command arguments
message DeleteCommandArgumentsRequest {
  string rules = 1;       // The rules context for the operation
  string path = 2;        // The path to the object with the command
  string command = 3;     // The name of the command
  string command_id = 4;  // The unique identifier of the command arguments to delete
}

// DeleteCommandArgumentsResponse is the response message for a delete command arguments operation
message DeleteCommandArgumentsResponse {
}

// CommandArg contains information about a command argument
message CommandArg {
  string type = 1;                                             // The type of the argument
  string name = 2;                                             // The name of the argument
  Schema info = 3;                                             // The schema information for this argument.
  string help_string = 4;                                      // Help text for the argument
  map<string, ansys.api.fluent.v1.variant.Variant> attrs = 5;  // Additional attributes for the argument
  string doc_string = 6;                                       // Documentation string for the argument
}

// CommandInfo contains information about a command or query
message CommandInfo {
  string return_type = 1;        // The return type of the command
  repeated CommandArg args = 2;  // The arguments for the command
  string doc_string = 3;         // Documentation string for the command
}

// Schema contains the static API description of objects, including types, parameters, commands, and queries.
message Schema {
  map<string, Schema> named_objects = 1;                        // Named objects within this object
  map<string, Schema> singletons = 2;                           // Singleton objects within this object
  map<string, Schema> parameters = 3;                           // Parameters within this object
  map<string, Schema> commands = 4;                             // Commands available for this object
  string type = 5;                                              // The type of this object
  CommandInfo command_info = 6;                                 // Information about the command (if this is a command)
  map<string, Schema> queries = 7;                              // Queries available for this object
  CommandInfo query_info = 8;                                   // Information about the query (if this is a query)
  string help_string = 9;                                       // Help text for this object
  map<string, ansys.api.fluent.v1.variant.Variant> attrs = 10;  // Additional attributes for this object
}

// GetSchemaRequest is the request message for GetSchema.
message GetSchemaRequest {
  string rules = 1;  // The rules context for the schema query.
}

// GetSchemaResponse is the response message for GetSchema.
message GetSchemaResponse {
  Schema info = 1;  // The API schema for the object model.
}

// CreatedEventRequest is used to subscribe to object creation events
message CreatedEventRequest {
  string parent_path = 1;  // parent-path of the created object
  string child_type = 2;   // type of the created object
}

// ModifiedEventRequest is used to subscribe to object modification events
message ModifiedEventRequest {
  string path = 1;  // path of the modified object
}

// DeletedEventRequest is used to subscribe to object deletion events
message DeletedEventRequest {
  string path = 1;  // path of the deleted object
}

// AffectedEventRequest is used to subscribe to object affected events
message AffectedEventRequest {
  string path = 1;     // path of the affected object
  string subtype = 2;  // subtype of the affected event
}

// AttributeChangedEventRequest is used to subscribe to attribute change events
message AttributeChangedEventRequest {
  string path = 1;       // path of the object whose attribute is changed
  string attribute = 2;  // name of the attribute
}

// CommandAttributeChangedEventRequest is used to subscribe to command attribute change events
message CommandAttributeChangedEventRequest {
  string path = 1;       // path of the object whose command attribute is changed
  string command = 2;    // name of the command
  string attribute = 3;  // name of the attribute
}

// CommandExecutedEventRequest is used to subscribe to command execution events
message CommandExecutedEventRequest {
  string path = 1;                         // path of the object with the command
  string command = 2 [deprecated = true];  // name of the command, deprecated since Fluent 2025 R2
}

// ObjectModelEventRequest is a request to subscribe to specific events
message ObjectModelEventRequest {
  string rules = 1;  // The rules context for the event subscription
  oneof event_request {
    CreatedEventRequest created_event_request = 2;                                    // Subscribe to creation events
    ModifiedEventRequest modified_event_request = 3;                                  // Subscribe to modification events
    DeletedEventRequest deleted_event_request = 4;                                    // Subscribe to deletion events
    AffectedEventRequest affected_event_request = 5;                                  // Subscribe to affected events
    AttributeChangedEventRequest attribute_changed_event_request = 6;                 // Subscribe to attribute change events
    CommandAttributeChangedEventRequest command_attribute_changed_event_request = 7;  // Subscribe to command attribute change events
    CommandExecutedEventRequest command_executed_event_request = 8;                   // Subscribe to command execution events
  }
}

// SubscribeEventsRequest is the request message for subscribing to events
message SubscribeEventsRequest {
  repeated ObjectModelEventRequest event_requests = 1;  // The list of event subscriptions to register
}

// SubscriptionStatus indicates the status of an event subscription
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;   // Unspecified subscription status
  SUBSCRIPTION_STATUS_SUBSCRIBED = 1;    // Successfully subscribed
  SUBSCRIPTION_STATUS_UNSUBSCRIBED = 2;  // Successfully unsubscribed
}

// EventSubscription contains information about a subscribed event
message EventSubscription {
  // tag is used to identify a subscribed event in server.
  // A subscribed event can later be unsubscribed.
  string tag = 1;                 // Unique identifier for the subscription
  SubscriptionStatus status = 2;  // The status of the subscription
}

// SubscribeEventsResponse is the response message containing subscription status
message SubscribeEventsResponse {
  repeated EventSubscription responses = 1;  // The list of event subscriptions with their status
}

// UnsubscribeEventsRequest is the request message for unsubscribing from events
message UnsubscribeEventsRequest {
  repeated string tags = 1;  // The list of subscription tags to unsubscribe
}

// UnsubscribeEventsResponse is the response message containing unsubscription status
message UnsubscribeEventsResponse {
  repeated EventSubscription responses = 1;  // The list of unsubscribed events with their status
}

// StreamEventsRequest is the request message for starting event streaming
message StreamEventsRequest {
}

// CreatedEventResponse is the response message for object creation events
message CreatedEventResponse {
  string parent_path = 1;  // parent-path of the created object
  string child_type = 2;   // type of the created object
  string child_name = 3;   // name of the created object
}

// ModifiedEventResponse is the response message for object modification events
message ModifiedEventResponse {
  string path = 1;                                // path of the modified object
  ansys.api.fluent.v1.variant.Variant value = 2;  // value of the modified object
}

// DeletedEventResponse is the response message for object deletion events
message DeletedEventResponse {
  string path = 1;  // path of the deleted object
}

// AffectedEventResponse is the response message for object affected events
message AffectedEventResponse {
  string path = 1;     // path of the affected object
  string subtype = 2;  // subtype of the affected event
}

// AttributeChangedEventResponse is the response message for attribute change events
message AttributeChangedEventResponse {
  string path = 1;                                // path of the object whose attribute is changed
  string attribute = 2;                           // name of the attribute
  ansys.api.fluent.v1.variant.Variant value = 3;  // value of the attribute
}

// CommandAttributeChangedEventResponse is the response message for command attribute change events
message CommandAttributeChangedEventResponse {
  string path = 1;                                // path of the object whose command attribute is changed
  string command = 2;                             // name of the command
  string attribute = 3;                           // name of the attribute
  ansys.api.fluent.v1.variant.Variant value = 4;  // value of the attribute
}

// CommandExecutedEventResponse is the response message for command execution events
message CommandExecutedEventResponse {
  string path = 1;                               // path of the object with the command
  string command = 2;                            // name of the command
  ansys.api.fluent.v1.variant.Variant args = 3;  // command arguments
}

// StreamEventsResponse is the streaming response containing events
message StreamEventsResponse {
  string tag = 1;    // The tag identifying the subscription that generated this event
  string rules = 2;  // The rules context for the event
  oneof event_response {
    CreatedEventResponse created_event_response = 3;                                    // Object creation event
    ModifiedEventResponse modified_event_response = 4;                                  // Object modification event
    DeletedEventResponse deleted_event_response = 5;                                    // Object deletion event
    AffectedEventResponse affected_event_response = 6;                                  // Object affected event
    AttributeChangedEventResponse attribute_changed_event_response = 7;                 // Attribute change event
    CommandAttributeChangedEventResponse command_attribute_changed_event_response = 8;  // Command attribute change event
    CommandExecutedEventResponse command_executed_event_response = 9;                   // Command execution event
  }
}

// RenameRequest is the request message for renaming an object
message RenameRequest {
  string rules = 1;     // The rules context for the rename operation
  string path = 2;      // The path to the object to rename
  string new_name = 3;  // The new name for the object
  bool wait = 4;        // If true, waits for the operation to complete before returning.
}

// RenameResponse is the response message after renaming an object
message RenameResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after the rename
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// GetObjectNamesRequest is the request message for retrieving object names
message GetObjectNamesRequest {
  string rules = 1;  // The rules context for the query
  string path = 2;   // The path to retrieve object names from
}

// GetObjectNamesResponse is the response message containing object names
message GetObjectNamesResponse {
  repeated string names = 1;  // The list of object names at the specified path
}

// ChildNames contains a list of child object names
message ChildNames {
  repeated string names = 1;  // The list of child names
}

// DeleteChildObjectsRequest is the request message for deleting child objects
message DeleteChildObjectsRequest {
  string rules = 1;  // The rules context for the deletion
  string path = 2;   // The path to the parent object
  oneof var {
    ChildNames child_names = 3;  // Specific child names to delete
    bool delete_all = 4;         // If true, deletes all child objects.
  }
  bool wait = 5;  // If true, waits for the operation to complete before returning.
}

// DeleteChildObjectsResponse is the response message after deleting child objects
message DeleteChildObjectsResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The updated state after deletion
  repeated string deleted_paths = 2;              // Paths of deleted objects
}

// FixStateRequest is the request message for fixing the state of an object
message FixStateRequest {
  string rules = 1;  // The rules context for the fix operation
  string path = 2;   // The path to the object to fix
}

// FixStateResponse is the response message after fixing state
message FixStateResponse {
  ansys.api.fluent.v1.variant.Variant state = 1;  // The fixed state
  repeated string deleted_paths = 2;              // Paths of deleted objects during fix
}
