syntax = "proto3";

package ansys.api.fluent.v1.app_utilities;

// AppUtilities provides operations that span the Fluent application lifecycle but do not belong
// to a domain-specific service. Typical uses include retrieving version and build metadata, managing
// feature flags, and controlling application startup and shutdown.
service AppUtilities {
  // Returns the product version of the running application.
  rpc GetProductVersion(GetProductVersionRequest) returns (GetProductVersionResponse);

  // Returns build metadata for the running application (build time, build id, and other related information).
  rpc GetBuildInfo(GetBuildInfoRequest) returns (GetBuildInfoResponse);

  // Retrieves Controller process information when running in client-server mode (Controller -> Solver)
  // i.e., the Controller process commanding the Solver process.
  rpc GetControllerProcessInfo(GetControllerProcessInfoRequest) returns (GetControllerProcessInfoResponse);

  // Returns solver-process information for the running application.
  rpc GetSolverProcessInfo(GetSolverProcessInfoRequest) returns (GetSolverProcessInfoResponse);

  // Returns the current application mode (for example, meshing or solver).
  rpc GetAppMode(GetAppModeRequest) returns (GetAppModeResponse);

  // Starts a Python journal recording session.
  // If a journal file name is provided, the journal is written to that file.
  rpc StartPythonJournal(StartPythonJournalRequest) returns (StartPythonJournalResponse);

  // Stops a Python journal recording session.
  rpc StopPythonJournal(StopPythonJournalRequest) returns (StopPythonJournalResponse);

  // Returns whether beta/experimental features are enabled for this session.
  rpc IsBetaEnabled(IsBetaEnabledRequest) returns (IsBetaEnabledResponse);

  // Enables beta/experimental features for this session.
  rpc EnableBeta(EnableBetaRequest) returns (EnableBetaResponse);

  // Returns whether the provided string is considered a wildcard by the solver application's syntax.
  rpc IsWildcard(IsWildcardRequest) returns (IsWildcardResponse);

  // Returns whether solution data is currently available.
  rpc IsSolutionDataAvailable(IsSolutionDataAvailableRequest) returns (IsSolutionDataAvailableResponse);

  // The following three RPCs support synchronous client-side callbacks triggered by solution events
  // (for example, per-iteration or per-time-step).
  //
  // Conceptually:
  // 1) The client registers an event of interest.
  // 2) When the event occurs, the solver pauses and notifies the registered client.
  // 3) After the client completes its callback work, it resumes the solver.
  //
  // This mechanism is useful when a client must perform an action at deterministic points in the solve.

  // Registers the client so the solver pauses when a selected solution event occurs.
  rpc RegisterSolutionEventsPause(RegisterSolutionEventsPauseRequest) returns (RegisterSolutionEventsPauseResponse);

  // Resumes solver execution after a pause triggered by a solution event.
  rpc ResumeSolutionEvent(ResumeSolutionEventRequest) returns (ResumeSolutionEventResponse);

  // Unregisters a prior pause-on-solution-event registration.
  rpc UnregisterSolutionEventsPause(UnregisterSolutionEventsPauseRequest) returns (UnregisterSolutionEventsPauseResponse);

  // Terminates the application.
  rpc Exit(ExitRequest) returns (ExitResponse);

  // Changes the application's current working directory.
  rpc SetWorkingDirectory(SetWorkingDirectoryRequest) returns (SetWorkingDirectoryResponse);
}

// Request to retrieve product version information.
message GetProductVersionRequest {
}

// Contains the product version information.
message GetProductVersionResponse {
  // Major version number.
  int64 major = 1;
  // Minor version number.
  int64 minor = 2;
  // Patch version number.
  int64 patch = 3;
}

// Request to retrieve build information.
message GetBuildInfoRequest {
}

// Contains the build information.
message GetBuildInfoResponse {
  // Build timestamp (format is server-defined).
  string build_time = 1;
  // Build identifier (server-defined).
  int64 build_id = 2;
  // Version-control revision identifier (for example, a commit hash).
  string vcs_revision = 3;
  // Version-control branch name.
  string vcs_branch = 4;
}

// Request to retrieve Controller process information.
message GetControllerProcessInfoRequest {
}

// Contains the Controller process information.
message GetControllerProcessInfoResponse {
  // Hostname where the Controller process is running.
  string hostname = 1;
  // Operating-system process id of the Controller process.
  int64 process_id = 2;
  // Controller process working directory.
  string working_directory = 3;
}

// Request to retrieve Solver process information.
message GetSolverProcessInfoRequest {
}

// Contains the Solver process information.
message GetSolverProcessInfoResponse {
  // Hostname where the Solver process is running.
  string hostname = 1;
  // Operating-system process id of the Solver process.
  int64 process_id = 2;
  // Solver process working directory.
  string working_directory = 3;
}

// Request to retrieve the application mode.
message GetAppModeRequest {
}

// Contains the application mode.
message GetAppModeResponse {
  // Current application mode.
  AppMode app_mode = 1;
}

// Initiates a Python journal recording session.
message StartPythonJournalRequest {
  // Optional journal output file name.
  //
  // If set, the journal is written to this file on the server side.
  // If not set, the journal text can be retrieved from StopPythonJournal.
  optional string journal_name = 1;
}

// Contains the result of starting a Python journal.
message StartPythonJournalResponse {
  // Optional journal identifier.
  //
  // Returned when no journal file name was provided and the journal is tracked in-memory/session state.
  // Provide this id to StopPythonJournal to stop the correct recording session.
  optional string journal_id = 1;
}

// Terminates a Python journal recording session.
message StopPythonJournalRequest {
  // Optional journal identifier to stop.
  //
  // Required when StartPythonJournal did not provide a file name and returned a journal_id.
  optional string journal_id = 1;
}

// Contains the result of stopping a Python journal.
message StopPythonJournalResponse {
  // Journal content.
  //
  // Typically populated when StartPythonJournal did not specify a file name. If the journal was written
  // to a file, this string may be empty (server-defined behavior).
  string journal_str = 1;
}

// Request to check if beta features are enabled.
message IsBetaEnabledRequest {
}

// Indicates whether beta features are enabled.
message IsBetaEnabledResponse {
  // True if beta/experimental features are enabled for this session.
  bool is_beta_enabled = 1;
}

// Requests to enable beta features.
message EnableBetaRequest {
}

// Result of enabling beta features.
message EnableBetaResponse {
}

// Checks if a string is a wildcard.
message IsWildcardRequest {
  // Input string to evaluate.
  string input = 1;
}

// Indicates whether the input is a wildcard.
message IsWildcardResponse {
  // True if the input string is a wildcard per solver application syntax.
  bool is_wildcard = 1;
}

// Request to check if solution data is available.
message IsSolutionDataAvailableRequest {
}

// Indicates whether solution data is available.
message IsSolutionDataAvailableResponse {
  // True if solution data is currently available.
  bool is_solution_data_available = 1;
}

// Registers interest in a specific solution event. When the event occurs, the solver pauses and waits
// until the client explicitly resumes it.
message RegisterSolutionEventsPauseRequest {
  // Solution event that triggers a pause.
  SolutionEvent solution_event = 1;
}

// Contains the registration identifier.
message RegisterSolutionEventsPauseResponse {
  // Registration id used to resume and/or unregister this pause registration.
  int64 registration_id = 1;
}

// Resumes from a pause on solution event.
message ResumeSolutionEventRequest {
  // Identifier of the registration to resume.
  int64 registration_id = 1;
}

// Result of resuming.
message ResumeSolutionEventResponse {
}

// Unregisters from pause on solution events.
message UnregisterSolutionEventsPauseRequest {
  // Identifier of the registration to unregister.
  int64 registration_id = 1;
}

// Result of unregistering.
message UnregisterSolutionEventsPauseResponse {
}

// Requests to exit the application.
message ExitRequest {
}

// Result of an exit request.
message ExitResponse {
}

// Changes the application's working directory.
message SetWorkingDirectoryRequest {
  // New working directory path.
  string path = 1;
}

// Result of setting the working directory.
message SetWorkingDirectoryResponse {
}

// Application operating mode.
enum AppMode {
  // Unspecified application mode.
  APP_MODE_UNSPECIFIED = 0;
  // Meshing mode.
  APP_MODE_MESHING = 1;
  // Solver mode.
  APP_MODE_SOLVER = 2;
  // Solver icing mode.
  APP_MODE_SOLVER_ICING = 3;
  // Solver aero mode.
  APP_MODE_SOLVER_AERO = 4;
}

// Solution-related events that can be used to pause/resume execution.
enum SolutionEvent {
  // Unspecified solution event.
  SOLUTION_EVENT_UNSPECIFIED = 0;
  // Fired after an iteration completes.
  SOLUTION_EVENT_ITERATION = 1;
  // Fired after a time step completes.
  SOLUTION_EVENT_TIME_STEP = 2;
}
