syntax = "proto3";

package ansys.api.fluent.v1.transcript;

option objc_class_prefix = "HLW";

// Transcript service provides streaming of solver transcript output to clients.
service Transcript {
  // Stream transcript output from the solver; the server sends TranscriptResponse
  // messages until the client cancels the stream.
  rpc BeginStreaming(TranscriptRequest) returns (stream TranscriptResponse);
}

// Request to begin streaming transcript output.
message TranscriptRequest {
}

// Response message containing a chunk of transcript text.
// Each chunk is flushed by the server either when a newline character is written
// (character-by-character output) or immediately when a string is written.
message TranscriptResponse {
  // A chunk of transcript text. May contain a partial line, a complete line
  // ending with '\n', or multiple lines depending on how the solver wrote the output.
  string transcript = 1;
}
