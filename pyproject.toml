[build-system]
requires = ["setuptools >= 82.0.1", "wheel", "ansys_tools_protoc_helper>=0.7.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-timeout",
    "grpcio",
    "ansys-fluent-core==0.39.dev1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
